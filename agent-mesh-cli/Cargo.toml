[package]
name = "agent-mesh-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Command-line interface for agent-mesh."

[[bin]]
name = "amesh"
path = "src/main.rs"

[lib]
name = "agent_mesh_cli"
path = "src/lib.rs"

[dependencies]
agent-mesh-protocol.workspace = true
agent-mesh-discovery.workspace = true
agent-mesh-transport.workspace = true
agent-mesh-bus.workspace = true
agent-mesh-flock.workspace = true
agent-mesh-flock-server = { workspace = true, features = ["serve"] }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
ssh-key.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
content-addressable.workspace = true
rand.workspace = true
age = { version = "0.11", features = ["armor"] }
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "termios", "stdio"] }
agent-mesh-flock-session = { workspace = true, features = ["emit"] }

[features]
# A signer UI that confirms by itself, for tests only. Never in `default`, and
# nothing in the binary names it.
test-ui = []

[dev-dependencies]
agent-mesh-cli = { path = ".", features = ["test-ui"] }
tempfile.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
wiremock.workspace = true
agent-mesh-transport-ssh.workspace = true
ed25519-dalek.workspace = true

[lints]
workspace = true
