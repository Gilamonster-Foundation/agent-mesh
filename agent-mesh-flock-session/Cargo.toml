[package]
name = "agent-mesh-flock-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "The agent-mesh flock session process: an ssh-agent-style holder of one session key."
readme = "README.md"

[features]
# The signer: the session process, its key, and the emit path. On by default;
# a reader that only follows a log turns it off.
default = ["emit"]
emit = ["agent-mesh-flock-server/serve"]

[dependencies]
agent-mesh-protocol.workspace = true
agent-mesh-flock.workspace = true
agent-mesh-flock-server.workspace = true
content-addressable.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
serde.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["mm", "process", "net", "event", "fs"] }
libc = "0.2"

[dev-dependencies]
# fixtures build a log with a real server, whatever the features under test
agent-mesh-flock-server = { workspace = true, features = ["serve"] }
tempfile.workspace = true

[lints]
workspace = true
