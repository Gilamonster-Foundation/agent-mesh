[package]
name = "agent-mesh-flock-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "The agent-mesh flock server: init, the signed append-only log, admission and recovery."
readme = "README.md"

[features]
# The writer: the server, its sockets, key file and log. On by default; a
# reader that only verifies and follows a log turns it off.
default = ["serve"]
serve = []

[dependencies]
agent-mesh-protocol.workspace = true
agent-mesh-flock.workspace = true
content-addressable.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process", "net"] }
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
